<section class="vista-registro max-w-md w-full mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold tracking-tight text-slate-900">Crea tu cuenta de pasajero</h2>
    <p class="text-slate-500 text-sm mt-1">Regístrate en pocos segundos para reservar y acumular beneficios.</p>
  </div>

  <div class="alerta hidden p-4 rounded-xl text-sm flex items-start gap-3" role="status">
    <span class="alerta-icono material-symbols-outlined text-[20px] mt-0.5">info</span>
    <div class="alerta-texto flex-1 leading-snug"></div>
  </div>

  <form id="form-registro" class="space-y-5" novalidate>
    <div class="space-y-1.5">
      <label class="block text-sm font-semibold text-slate-700" for="registro-nombre">Nombre y Apellido</label>
      <div class="campo relative rounded-xl border border-slate-300 bg-white shadow-sm">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px] text-slate-400">person</span>
        <input id="registro-nombre" name="nombre" type="text" autocomplete="name"
          class="w-full bg-transparent pl-11 pr-4 py-3 text-slate-900 placeholder-slate-400 text-sm focus:outline-none border-none ring-0"
          placeholder="Ej. Roberto Morales Sánchez">
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="block text-sm font-semibold text-slate-700" for="registro-email">Correo Electrónico</label>
      <div class="campo relative rounded-xl border border-slate-300 bg-white shadow-sm">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px] text-slate-400">mail</span>
        <input id="registro-email" name="email" type="email" autocomplete="email"
          class="w-full bg-transparent pl-11 pr-4 py-3 text-slate-900 placeholder-slate-400 text-sm focus:outline-none border-none ring-0"
          placeholder="pasajero@aerovuelo.com">
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="block text-sm font-semibold text-slate-700" for="registro-password">Contraseña</label>
      <div class="campo relative rounded-xl border border-slate-300 bg-white shadow-sm">
        <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px] text-slate-400">lock</span>
        <input id="registro-password" name="password" type="password" autocomplete="new-password"
          class="w-full bg-transparent pl-11 pr-11 py-3 text-slate-900 placeholder-slate-400 text-sm focus:outline-none border-none ring-0"
          placeholder="••••••••••••">
        <button class="mostrar-clave absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 rounded-md transition-colors" type="button" aria-label="Mostrar u ocultar contraseña">
          <span class="material-symbols-outlined text-[20px]">visibility</span>
        </button>
      </div>

      <div class="medidor pt-2 space-y-1.5">
        <div class="flex items-center justify-between text-xs">
          <span class="text-slate-500">Seguridad de la contraseña:</span>
          <span class="etiqueta-seguridad font-semibold text-slate-500 font-mono">Baja</span>
        </div>
        <div class="barras grid grid-cols-4 gap-1.5 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
          <div class="barra h-full bg-slate-200 transition-all duration-300"></div>
          <div class="barra h-full bg-slate-200 transition-all duration-300"></div>
          <div class="barra h-full bg-slate-200 transition-all duration-300"></div>
          <div class="barra h-full bg-slate-200 transition-all duration-300"></div>
        </div>
        <p class="text-[11px] text-slate-500 leading-normal">
          Utiliza al menos 8 caracteres con letras mayúsculas, números o símbolos.
        </p>
      </div>
    </div>

    <button id="registro-enviar" class="boton-principal w-full h-12 bg-[#0B192C] hover:bg-[#132A4A] text-white rounded-xl font-bold text-sm tracking-wide shadow-lg shadow-slate-900/10 flex items-center justify-center gap-2.5 transition-all duration-200 active:scale-[0.99] mt-2" type="submit">
      <span class="material-symbols-outlined text-[20px]">how_to_reg</span>
      <span class="whitespace-nowrap">Completar Registro</span>
    </button>
  </form>
</section>
