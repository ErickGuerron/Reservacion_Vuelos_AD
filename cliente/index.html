<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroVuelo · Sky Booking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="tailwind-config.js"></script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col">

  <!-- Cabecera global -->
  <header class="fixed top-0 left-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="h-16 w-full px-margin-mobile md:px-margin flex items-center justify-between gap-space-md">
      <a class="flex items-center gap-space-sm flex-shrink-0" href="#vuelos">
        <span class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[22px]">flight_takeoff</span>
        </span>
        <span class="flex flex-col">
          <span class="font-headline-sm text-headline-sm tracking-tight text-on-surface leading-none">AeroVuelo</span>
          <span class="font-telemetry-code text-[10px] tracking-wider uppercase text-secondary font-bold">Sky Booking System</span>
        </span>
      </a>

      <nav class="hidden xl:flex items-center gap-space-xs p-1 bg-surface-container-low rounded-xl" aria-label="Principal">
        <a class="enlace-ruta px-space-md py-1.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-ruta="vuelos" href="#vuelos">Explorar Vuelos</a>
        <a class="enlace-ruta px-space-md py-1.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all flex items-center gap-1.5" data-ruta="reservas" href="#reservas">
          <span>Mis Reservas</span>
          <span class="hidden px-1.5 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-telemetry-code text-[11px] font-bold" id="contador-reservas"></span>
        </a>
        <a class="enlace-ruta px-space-md py-1.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-all" data-ruta="consola" href="#consola">Consola API / JSON</a>
      </nav>

      <div class="flex items-center gap-space-md">
        <div class="hidden md:flex items-center gap-2 px-space-sm py-1 rounded-full bg-surface-container-low border border-surface-variant">
          <span class="w-2 h-2 rounded-full bg-secondary"></span>
          <span class="font-telemetry-code text-telemetry-code text-on-surface-variant" id="sesion-texto">Sin sesión</span>
        </div>
        <div class="h-6 w-px bg-surface-variant hidden sm:block"></div>
        <div class="flex items-center gap-space-sm">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
            <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
          </div>
          <a class="hidden items-center gap-1 font-label-md text-label-md text-on-surface-variant hover:text-error transition-colors" href="#login" id="cerrar-sesion">
            <span class="material-symbols-outlined text-[16px]">logout</span>
            <span>Cerrar sesión</span>
          </a>
          <a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface sm:hidden" href="#login" id="ir-login-movil">Ingresar</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Vista activa: la carga componentes/ según el hash de la URL -->
  <main class="w-full pt-16 bg-surface flex-1" id="vista"></main>

  <footer class="w-full bg-surface-container-lowest shadow-[0_-1px_8px_rgba(0,0,0,0.02)]">
    <div class="w-full px-margin-mobile md:px-margin py-space-lg flex flex-col md:flex-row items-center justify-between gap-space-md text-on-surface-variant">
      <span class="font-body-sm text-body-sm">© 2025 AeroVuelo Sky Booking System. Arquitectura Microservicios Distribuida.</span>
    </div>
  </footer>

  <script src="componentes/cargador.js"></script>
  <script src="app.js"></script>
</body>
</html>
